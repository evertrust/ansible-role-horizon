---

# Creates the tenants declared in horizon_tenants through the root-scope API
# once the service answers. Tenants are a cluster-global object: everything
# runs once, against the first node.
#
# Authentication: horizon_admin_password when provided, otherwise the
# bootstrap administrator password generated by Horizon on first start
# (kept in /opt/horizon/var/run/adminPassword on the node).
#
# The creation response carries the generated administrator password of the
# tenant (immutable name, initial credentials): it is stored on the node next
# to the bootstrap password, as /opt/horizon/var/run/tenant-<name>-adminPassword.

# First boot of a fresh HA cluster takes several minutes before /ready
# answers 200 (keyset distribution, MongoDB migrations, cluster formation):
# a 502 from nginx just means the Pekko management endpoint is not up yet.
- name: Tenants - Wait for Horizon to answer readiness checks
  ansible.builtin.uri:
    url: "https://{{ horizon_hostname_node }}/ready"
    validate_certs: false
  register: tenants_ready
  until: tenants_ready.status == 200
  retries: 60
  delay: 10
  run_once: true

- name: Tenants - Read the bootstrap administrator password
  ansible.builtin.slurp:
    src: /opt/horizon/var/run/adminPassword
  register: tenants_bootstrap_password
  run_once: true
  no_log: true
  when: horizon_admin_password | length == 0

- name: Tenants - Select the administrator credentials
  ansible.builtin.set_fact:
    tenants_admin_password: >-
      {{ horizon_admin_password if horizon_admin_password | length > 0
         else tenants_bootstrap_password.content | b64decode | trim }}
  run_once: true
  no_log: true

# 200 with a JSON array when tenants exist, 204 without a body when the
# instance has none yet
- name: Tenants - List the existing tenants
  ansible.builtin.uri:
    url: "https://{{ horizon_hostname_node }}/api/v1/security/tenants"
    url_username: "{{ horizon_admin_username }}"
    url_password: "{{ tenants_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
    status_code: [200, 204, 401, 403]
  register: tenants_existing
  run_once: true
  no_log: true

- name: Tenants - Fail when the API rejects the administrator credentials
  ansible.builtin.fail:
    msg: |
      Cannot authenticate against the Horizon API as '{{ horizon_admin_username }}'
      (HTTP {{ tenants_existing.status }}): the bootstrap password is no longer
      valid or the account changed. Either provide the current credentials with
      horizon_admin_username / horizon_admin_password, or disable the automatic
      tenant creation with horizon_create_tenants: false.
  run_once: true
  when: tenants_existing.status not in [200, 204]

- name: Tenants - Collect the existing tenant names
  ansible.builtin.set_fact:
    tenants_existing_names: >-
      {{ tenants_existing.json | default([]) | map(attribute='name') | list }}
  run_once: true

- name: Tenants - Create the missing tenants
  ansible.builtin.uri:
    url: "https://{{ horizon_hostname_node }}/api/v1/security/tenants"
    method: POST
    url_username: "{{ horizon_admin_username }}"
    url_password: "{{ tenants_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: >-
      {{ {'name': item.name,
          'description': item.description | default('Created by ansible-role-horizon'),
          'license': {'certificate': {
            'limit': item.certificate_limit | default(horizon_tenant_default_certificate_limit),
            'scope': item.certificate_module | default(horizon_tenant_default_certificate_module)}}}
         | combine({'administratorPassword': item.admin_password}
                   if item.admin_password is defined else {}) }}
    return_content: true
    status_code: [201]
  loop: "{{ horizon_tenants }}"
  loop_control:
    label: "{{ item.name }}"
  register: tenants_created
  run_once: true
  when: item.name not in tenants_existing_names
  no_log: true

# The generated initial password only exists in the creation response: persist
# it where Horizon keeps the bootstrap one, otherwise it is lost for good.
- name: Tenants - Store the initial administrator password of each created tenant
  ansible.builtin.copy:
    content: "{{ item.json.account.password }}\n"
    dest: "/opt/horizon/var/run/tenant-{{ item.item.name }}-adminPassword"
    owner: horizon
    group: horizon
    mode: "0600"
  loop: "{{ tenants_created.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  run_once: true
  no_log: true
  when:
    - item is not skipped
    - item.json is defined
    - item.json.account is defined
    - item.item.admin_password is not defined

- name: Tenants - Show tenancy provisioning summary
  ansible.builtin.debug:
    msg: >-
      Tenants present: {{ tenants_existing_names
        | union(tenants_created.results | default([]) | rejectattr('skipped', 'defined')
                | map(attribute='item.name') | list) | join(', ') }}.
      Initial tenant administrator passwords (generated ones) are stored on
      {{ horizon_hostname_node }} in /opt/horizon/var/run/tenant-<name>-adminPassword.
  run_once: true
