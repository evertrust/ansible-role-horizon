---

- name: Config - Check if Horizon is installed
  ansible.builtin.stat:
    path: /opt/horizon
  register: horizon_check

- name: Config - Fail if Horizon not installed
  ansible.builtin.fail:
    msg: |
      Horizon is not installed! The /opt/horizon directory does not exist.
      This usually means the Horizon RPM installation failed.
      Please check:
      1. Repository credentials are correct (horizon_repository_username/password)
      2. The RPM download succeeded
      3. The RPM installation completed
      Check the previous task output for errors.
  when: not horizon_check.stat.exists

- name: Config - Ensure Horizon directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/horizon/etc
    - /opt/horizon/var/log
    - /opt/horizon/var/run

# Replaces the packaged symlink (/opt/horizon/etc/horizon-httpd.conf) with a
# role-managed config so tenant vhosts can be rendered
- name: Config - Deploy nginx vhost configuration
  ansible.builtin.template:
    src: "{{ horizon_template_nginx }}"
    dest: "{{ horizon_path_to_nginx_conf }}"
    mode: '0644'
  notify: "Horizon - Handlers - Restart nginx services"

- name: Config - Check if licence file source exists
  ansible.builtin.stat:
    path: "{{ horizon_licence_src_path }}"
  register: licence_file_check
  delegate_to: localhost
  become: false
  when:
    - horizon_licence_src_path is defined
    - horizon_licence_src_path != ""
    - horizon_licence_src_path != "path_to_your_licence_file"

- name: Config - Fail if licence file not found
  ansible.builtin.fail:
    msg: |
      Licence file not found at: {{ horizon_licence_src_path }}
      Please provide a valid Horizon licence file by either:
      1. Setting HORIZON_LICENCE_PATH environment variable
      2. Setting horizon_licence_src_path in your configuration
      3. Placing the licence file at the specified path
  when:
    - horizon_licence_src_path is defined
    - horizon_licence_src_path != ""
    - horizon_licence_src_path != "path_to_your_licence_file"
    - licence_file_check.stat is defined
    - not (licence_file_check.stat.exists | default(false))

- name: Config - Copy licence from source file
  ansible.builtin.copy:
    src: "{{ horizon_licence_src_path }}"
    dest: "{{ horizon_licence_dest_path }}"
    owner: root
    group: horizon
    mode: '0640'
  diff: false
  when:
    - horizon_licence_src_path is defined
    - horizon_licence_src_path != ""
    - horizon_licence_src_path != "path_to_your_licence_file"
    - licence_file_check.stat is defined
    - licence_file_check.stat.exists | default(false)

- name: Config - Fail if no licence path configured
  ansible.builtin.fail:
    msg: |
      No licence file path configured!
      Please provide a Horizon licence file by setting:
      - HORIZON_LICENCE_PATH environment variable, or
      - horizon_licence_src_path in mandatory_vars.yml
  when:
    - horizon_licence_src_path is not defined or horizon_licence_src_path == "" or horizon_licence_src_path == "path_to_your_licence_file"

- name: Config - Add horizon nodes to /etc/hosts (non-Docker)
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      {% for node in horizon_nodes %}
      {{ node.ip }} {{ node.hostname }}
      {% endfor %}
      {{ horizon_mongodb_ip }} {{ horizon_mongodb_hostname }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Horizon Cluster"
    create: false
    unsafe_writes: true
  when: ansible_facts['virtualization_type'] != "docker"

- name: Config - Manage hosts for Docker environment
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^.*\\s{{ item.hostname | regex_escape }}(?:\\s|$).*$'
    line: "{{ item.ip }} {{ item.hostname }}"
    state: present
    unsafe_writes: true
  loop: "{{ horizon_nodes + [ {'ip': horizon_mongodb_ip, 'hostname': horizon_mongodb_hostname} ] }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: ansible_facts['virtualization_type'] == "docker" and (horizon_nodes[0].ip | regex_search('^\d+\.\d+\.\d+\.\d+$') is not none)

- name: Config - File creation /etc/default/horizon
  ansible.builtin.template:
    src: "{{ horizon_template_default_horizon }}"
    dest: "{{ horizon_path_to_default_horizon }}"
    mode: '0640'
  diff: false
  notify: "Horizon - Handlers - Restart horizon services"

- name: Config - Update hosts allowed
  ansible.builtin.template:
    src: "{{ horizon_template_hosts_allowed }}"
    dest: "{{ horizon_path_to_hosts_allowed }}"
    mode: '0644'
  notify: "Horizon - Handlers - Restart horizon services"

- name: Config - Copy Tinkey KMS/HSM credentials file to VM
  ansible.builtin.copy:
    src: "{{ horizon_tink_credentials_src_path }}"
    dest: "{{ horizon_tink_credentials_path }}"
    owner: horizon
    group: horizon
    mode: '0640'
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_tink_master_key_uri != ""
    - horizon_tink_credentials_src_path != ""

- name: Config - Check whether the Horizon cluster keyset already exists
  ansible.builtin.stat:
    path: /opt/horizon/etc/horizon.keyset
    checksum_algorithm: sha256
  register: horizon_keyset_file
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_nodes | length > 1

- name: Config - Refuse incomplete HA keyset bootstrap
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all | sort == (horizon_nodes | map(attribute='hostname') | list | sort)
      - not horizon_keyset_file.stat.exists
      - hostvars[item].get('horizon_keyset_file', {}).get('stat', {}).get('exists', false) == false
    fail_msg: >-
      The Horizon keyset is missing on the stable leader. A new HA keyset may
      only be generated when every declared node is targeted and no node has
      an existing keyset. Restore the original keyset instead of regenerating it.
  loop: "{{ ansible_play_hosts_all }}"
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_nodes | length > 1
    - inventory_hostname == horizon_nodes[0].hostname
    - not horizon_keyset_file.stat.exists

- name: Config - Refuse divergent Horizon keysets
  ansible.builtin.assert:
    that:
      - hostvars[item].get('horizon_keyset_file', {}).get('stat', {}).get('checksum', '') == horizon_keyset_file.stat.checksum
    fail_msg: >-
      Horizon keyset on '{{ item }}' differs from the stable leader
      '{{ horizon_nodes[0].hostname }}'. Restore a known-good keyset before
      changing this cluster.
  loop: "{{ ansible_play_hosts_all }}"
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_nodes | length > 1
    - inventory_hostname == horizon_nodes[0].hostname
    - horizon_keyset_file.stat.exists
    - item != horizon_nodes[0].hostname
    - hostvars[item].get('horizon_keyset_file', {}).get('stat', {}).get('exists', false)
  no_log: true

- name: Config - Require the keyset leader when a missing keyset must be shared
  ansible.builtin.assert:
    that:
      - horizon_nodes[0].hostname in ansible_play_hosts_all
    fail_msg: >-
      Horizon keyset is missing on '{{ inventory_hostname }}', but the stable
      leader '{{ horizon_nodes[0].hostname }}' is not targeted by this play.
      Include the leader so the shared keyset can be read safely.
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_nodes | length > 1
    - inventory_hostname != horizon_nodes[0].hostname
    - not horizon_keyset_file.stat.exists
    - horizon_nodes[0].hostname not in ansible_play_hosts_all

- name: Config - Generate the tink key on the stable leader (soft mode)
  ansible.builtin.shell: /opt/evertrust/tinkey/bin/tinkey create-keyset --key-template AES256_GCM --out=/opt/horizon/etc/horizon.keyset
  args:
    creates: /opt/horizon/etc/horizon.keyset
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - inventory_hostname == horizon_nodes[0].hostname
    - horizon_nodes | length > 1
    - horizon_tink_master_key_uri == ""

- name: Config - Generate the tink key on the stable leader (KMS/HSM mode)
  ansible.builtin.shell: >-
    /opt/evertrust/tinkey/bin/tinkey create-keyset --key-template AES256_GCM
    --out=/opt/horizon/etc/horizon.keyset
    --master-key-uri "{{ horizon_tink_master_key_uri }}"
    {{ '--credential "' + horizon_tink_credentials_path + '"' if horizon_tink_credentials_src_path != '' else '' }}
  args:
    creates: /opt/horizon/etc/horizon.keyset
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - inventory_hostname == horizon_nodes[0].hostname
    - horizon_nodes | length > 1
    - horizon_tink_master_key_uri != ""

- name: Config - Read keyset file from the stable leader
  ansible.builtin.slurp:
    src: /opt/horizon/etc/horizon.keyset
  register: horizon_keyset
  no_log: true
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - inventory_hostname == horizon_nodes[0].hostname
    - horizon_nodes | length > 1

- name: Config - Distribute a missing keyset to other nodes
  ansible.builtin.copy:
    content: "{{ hostvars[horizon_nodes[0].hostname]['horizon_keyset']['content'] | b64decode }}"
    dest: "/opt/horizon/etc/horizon.keyset"
    owner: horizon
    group: horizon
    mode: '0640'
  no_log: true
  diff: false
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - inventory_hostname != horizon_nodes[0].hostname
    - horizon_nodes | length > 1
    - not horizon_keyset_file.stat.exists
    - horizon_nodes[0].hostname in ansible_play_hosts_all

- name: Config - Generate keyset for standalone node (soft mode)
  ansible.builtin.shell: /opt/evertrust/tinkey/bin/tinkey create-keyset --key-template AES256_GCM --out=/opt/horizon/etc/horizon.keyset
  args:
    creates: /opt/horizon/etc/horizon.keyset
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_nodes | length == 1
    - horizon_tink_master_key_uri == ""

- name: Config - Generate keyset for standalone node (KMS/HSM mode)
  ansible.builtin.shell: >-
    /opt/evertrust/tinkey/bin/tinkey create-keyset --key-template AES256_GCM
    --out=/opt/horizon/etc/horizon.keyset
    --master-key-uri "{{ horizon_tink_master_key_uri }}"
    {{ '--credential "' + horizon_tink_credentials_path + '"' if horizon_tink_credentials_src_path != '' else '' }}
  args:
    creates: /opt/horizon/etc/horizon.keyset
  when:
    - (horizon_version.split('-')[0]) is version('2.8', '>=')
    - horizon_nodes | length == 1
    - horizon_tink_master_key_uri != ""

- name: Config - Set permissions and ownership of keyset file
  ansible.builtin.file:
    path: "/opt/horizon/etc/horizon.keyset"
    owner: horizon
    group: horizon
    mode: '0640'
  when: (horizon_version.split('-')[0]) is version('2.8', '>=')
