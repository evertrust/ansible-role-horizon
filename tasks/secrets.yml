---

# Generated application secrets are deliberately opt-in.  They are generated
# once on the first Horizon node, copied to every cluster node and persisted
# root-only so a later run never silently rotates an application secret.
- name: Secrets - Read previously generated secrets
  ansible.builtin.slurp:
    src: "{{ horizon_generated_secrets_path }}"
  register: horizon_generated_secrets_file
  failed_when: false
  changed_when: false
  no_log: true

- name: Secrets - Decode previously generated secrets
  ansible.builtin.set_fact:
    horizon_existing_generated_secrets: >-
      {{ horizon_generated_secrets_file.content | b64decode | from_yaml
         if horizon_generated_secrets_file.content is defined else {} }}
  no_log: true

- name: Secrets - Select the stable cluster leader
  ansible.builtin.set_fact:
    horizon_secret_leader: "{{ horizon_nodes | map(attribute='hostname') | first }}"

- name: Secrets - Require the cluster leader for incomplete HA secret input
  ansible.builtin.assert:
    that:
      - horizon_secret_leader in ansible_play_hosts_all
    fail_msg: >-
      Horizon secrets are missing or generated, but the stable leader
      '{{ horizon_secret_leader }}' is not targeted by this play. Include it
      (remove --limit or include the leader) so existing shared secrets are
      reused instead of risking a divergent cluster configuration.
  when:
    - horizon_nodes | length > 1
    - >-
      horizon_play_http_secret_key is search('^$|^CHANGE_THIS')
      or horizon_event_seal_secret is search('^$|^CHANGE_THIS')
      or ((horizon_version.split('-')[0]) is version('2.8', '<')
          and horizon_default_ssv_key is search('^$|^CHANGE_THIS'))
  run_once: true

- name: Secrets - Refuse a missing leader state when another targeted node has one
  ansible.builtin.assert:
    that:
      - hostvars[item].get('horizon_existing_generated_secrets', {}) | length == 0
    fail_msg: >-
      Horizon generated-secret state is missing on the stable leader
      '{{ horizon_secret_leader }}' but exists on '{{ item }}'. Restore the
      leader state explicitly; the role will not promote or rotate secrets.
  loop: "{{ ansible_play_hosts_all }}"
  when:
    - inventory_hostname == horizon_secret_leader
    - horizon_existing_generated_secrets | length == 0
    - item != horizon_secret_leader
    - hostvars[item].get('horizon_existing_generated_secrets', {}) | length > 0
  no_log: true

- name: Secrets - Refuse divergent generated-secret state
  ansible.builtin.assert:
    that:
      - hostvars[item].get('horizon_existing_generated_secrets', {}) == horizon_existing_generated_secrets
    fail_msg: >-
      Horizon generated-secret state differs between the stable leader
      '{{ horizon_secret_leader }}' and '{{ item }}'. Resolve the discrepancy
      from the secret manager before running this role again.
  loop: "{{ ansible_play_hosts_all }}"
  when:
    - inventory_hostname == horizon_secret_leader
    - horizon_existing_generated_secrets | length > 0
    - item != horizon_secret_leader
    - hostvars[item].get('horizon_existing_generated_secrets', {}) | length > 0
  no_log: true

- name: Secrets - Refuse an implicit rotation of generated Horizon secrets
  ansible.builtin.assert:
    that:
      - >-
        horizon_existing_generated_secrets.get('horizon_play_http_secret_key', '') | length == 0
        or horizon_play_http_secret_key is search('^$|^CHANGE_THIS')
        or horizon_play_http_secret_key == horizon_existing_generated_secrets.horizon_play_http_secret_key
      - >-
        horizon_existing_generated_secrets.get('horizon_event_seal_secret', '') | length == 0
        or horizon_event_seal_secret is search('^$|^CHANGE_THIS')
        or horizon_event_seal_secret == horizon_existing_generated_secrets.horizon_event_seal_secret
      - >-
        (horizon_version.split('-')[0]) is version('2.8', '>=')
        or horizon_existing_generated_secrets.get('horizon_default_ssv_key', '') | length == 0
        or horizon_default_ssv_key is search('^$|^CHANGE_THIS')
        or horizon_default_ssv_key == horizon_existing_generated_secrets.horizon_default_ssv_key
    fail_msg: >-
      A supplied Horizon secret differs from the persisted generated-secret
      state. Secret rotation is an explicit operational procedure; restore the
      canonical value or rotate every node and the state file together.
  when:
    - inventory_hostname == horizon_secret_leader
    - horizon_existing_generated_secrets | length > 0
  no_log: true

- name: Secrets - Resolve a shared set of application secrets
  ansible.builtin.set_fact:
    horizon_new_generated_secrets: >-
      {{ {}
         | combine(
             {'horizon_play_http_secret_key': lookup('ansible.builtin.password', '/dev/null', length=128, chars=['hexdigits'])}
             if (horizon_play_http_secret_key is search('^$|^CHANGE_THIS')
                 and horizon_existing_generated_secrets.get('horizon_play_http_secret_key', '') | length == 0
                 and horizon_generate_missing_secrets | bool) else {})
         | combine(
             {'horizon_default_ssv_key': lookup('ansible.builtin.password', '/dev/null', length=128, chars=['hexdigits'])}
             if ((horizon_version.split('-')[0]) is version('2.8', '<')
                 and horizon_default_ssv_key is search('^$|^CHANGE_THIS')
                 and horizon_existing_generated_secrets.get('horizon_default_ssv_key', '') | length == 0
                 and horizon_generate_missing_secrets | bool) else {})
         | combine(
             {'horizon_event_seal_secret': lookup('ansible.builtin.password', '/dev/null', length=128, chars=['hexdigits'])}
             if (horizon_event_seal_secret is search('^$|^CHANGE_THIS')
                 and horizon_existing_generated_secrets.get('horizon_event_seal_secret', '') | length == 0
                 and horizon_generate_missing_secrets | bool) else {}) }}
  when: inventory_hostname == horizon_secret_leader
  no_log: true

- name: Secrets - Select effective application secrets
  ansible.builtin.set_fact:
    horizon_effective_secrets: >-
      {{ {
          'horizon_play_http_secret_key': horizon_play_http_secret_key
            if horizon_play_http_secret_key is not search('^$|^CHANGE_THIS')
            else horizon_existing_generated_secrets.get('horizon_play_http_secret_key', '')
                 or horizon_new_generated_secrets.get('horizon_play_http_secret_key', ''),
          'horizon_default_ssv_key': horizon_default_ssv_key
            if horizon_default_ssv_key is not search('^$|^CHANGE_THIS')
            else horizon_existing_generated_secrets.get('horizon_default_ssv_key', '')
                 or horizon_new_generated_secrets.get('horizon_default_ssv_key', ''),
          'horizon_event_seal_secret': horizon_event_seal_secret
            if horizon_event_seal_secret is not search('^$|^CHANGE_THIS')
            else horizon_existing_generated_secrets.get('horizon_event_seal_secret', '')
                 or horizon_new_generated_secrets.get('horizon_event_seal_secret', '')
        } }}
  when: inventory_hostname == horizon_secret_leader
  no_log: true

- name: Secrets - Select canonical generated-secret state
  ansible.builtin.set_fact:
    horizon_canonical_generated_secrets: >-
      {{ horizon_existing_generated_secrets | combine(horizon_new_generated_secrets) }}
  when: inventory_hostname == horizon_secret_leader
  no_log: true

- name: Secrets - Apply the resolved secrets to every Horizon node
  ansible.builtin.set_fact:
    horizon_play_http_secret_key: >-
      {{ hostvars[horizon_secret_leader].horizon_effective_secrets.horizon_play_http_secret_key
         if horizon_secret_leader in ansible_play_hosts_all else horizon_play_http_secret_key }}
    horizon_default_ssv_key: >-
      {{ hostvars[horizon_secret_leader].horizon_effective_secrets.horizon_default_ssv_key
         if horizon_secret_leader in ansible_play_hosts_all else horizon_default_ssv_key }}
    horizon_event_seal_secret: >-
      {{ hostvars[horizon_secret_leader].horizon_effective_secrets.horizon_event_seal_secret
         if horizon_secret_leader in ansible_play_hosts_all else horizon_event_seal_secret }}
  no_log: true

- name: Secrets - Create the root-only secret state directory
  ansible.builtin.file:
    path: "{{ horizon_generated_secrets_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when:
    - horizon_secret_leader in ansible_play_hosts_all
    - hostvars[horizon_secret_leader].horizon_canonical_generated_secrets | length > 0

- name: Secrets - Persist canonical generated secrets on every Horizon node
  ansible.builtin.copy:
    content: >-
      {{ hostvars[horizon_secret_leader].horizon_canonical_generated_secrets | to_nice_yaml(indent=2) }}
    dest: "{{ horizon_generated_secrets_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when:
    - horizon_secret_leader in ansible_play_hosts_all
    - hostvars[horizon_secret_leader].horizon_canonical_generated_secrets | length > 0

- name: Secrets - Warn that generated values must be saved externally
  ansible.builtin.debug:
    msg: >-
      WARNING: Horizon generated missing application secrets (128 hexadecimal
      characters) and stored them root-only in {{ horizon_generated_secrets_path }}
      on every Horizon node. Save them immediately in the customer's Vault or
      secret manager. They will be reused on later runs and never rotated by
      this role automatically.
  when:
    - inventory_hostname == horizon_secret_leader
    - horizon_new_generated_secrets | length > 0
