  # MongoDB database server
  - name: mongodb-database
    image: mongo:8.0
    command: mongod --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: evertrust123
    networks:
      - name: horizon-network
    published_ports:
      - "27017:27017"
    groups:
      - mongodb

provisioner:
  name: ansible
  connection_options:
    ansible_connection: docker
  config_options:
    defaults:
      host_key_checking: false
      callbacks_enabled: timer
      stdout_callback: default
      result_format: yaml
  inventory:
    host_vars:
      horizon-node1:
        ansible_connection: docker
      # horizon-node2:
      #   ansible_connection: docker
      mongodb-database:
        ansible_connection: docker
    group_vars:
      all:
        # Horizon secret keys - fixed values for molecule testing (override via env vars in production)
        horizon_play_http_secret_key: "{{ lookup('env', 'HORIZON_PLAY_HTTP_SECRET_KEY') | default('MoleculeTestPlayHttpSecretKeyForHorizonDoNotUseInProduction1234', true) }}"
        horizon_default_ssv_key: "{{ lookup('env', 'HORIZON_DEFAULT_SSV_KEY') | default('MoleculeTestDefaultSSVKeyForHorizonDoNotUseInProduction12345678', true) }}"
        horizon_event_seal_secret: "{{ lookup('env', 'HORIZON_EVENT_SEAL_SECRET') | default('MoleculeTestEventSealSecretForHorizonDoNotUseInProduction12345', true) }}"

        # Horizon package installation
        horizon_version: 2.8.1
        horizon_pkg_uri: "https://repo.evertrust.io/repository/horizon-rpm/horizon-{{ horizon_version }}-1.noarch.rpm"
        horizon_repository_username: "{{ lookup('env', 'EVERTRUST_REPO_USERNAME') | default('CHANGE_THIS_repository_username', true) }}"
        horizon_repository_password: "{{ lookup('env', 'EVERTRUST_REPO_PASSWORD') | default('CHANGE_THIS_repository_password', true) }}"

        # Tinkey package installation (used when horizon_version >= 2.8)
        horizon_tinkey_version: 1.12.0.1
        horizon_tinkey_pkg_uri: "https://repo.evertrust.io/repository/tinkey-rpm/tinkey-{{ horizon_tinkey_version }}-1.noarch.rpm"

        # Licence configuration
        horizon_licence_src_path: "{{ lookup('env', 'HORIZON_LICENCE_PATH') | default(playbook_dir ~ '/files/horizon.lic', true) }}"

        # MongoDB configuration - credentials match the Docker container initialization
        horizon_mongodb_username: "{{ lookup('env', 'HORIZON_MONGODB_USERNAME') | default('admin', true) }}"
        horizon_mongodb_password: "{{ lookup('env', 'HORIZON_MONGODB_PASSWORD') | default('evertrust123', true) }}"
        horizon_mongodb_hostname: mongodb-database
        horizon_mongodb_ip: mongodb-database

        # Cluster nodes configuration
        horizon_nodes:
          - hostname: horizon-node1
            ip: horizon-node1
          # Uncomment to test HA mode:
          #- hostname: horizon-node2
          #  ip: horizon-node2

        # Tinkey KMS - requires horizon_version >= 2.8
        # Soft mode by default (horizon_version < 2.8 always uses soft mode regardless of URI)
        # Set HORIZON_TINK_MASTER_KEY_URI and HORIZON_TINK_CREDENTIALS_SRC_PATH env vars to enable KMS/HSM mode
        horizon_tink_master_key_uri: "{{ lookup('env', 'HORIZON_TINK_MASTER_KEY_URI') | default('', true) }}"
        horizon_tink_credentials_src_path: "{{ lookup('env', 'HORIZON_TINK_CREDENTIALS_SRC_PATH') | default('', true) }}"
        horizon_tink_credentials_path: "{{ lookup('env', 'HORIZON_TINK_CREDENTIALS_PATH') | default('/opt/horizon/etc/tink-credentials.json', true) }}"

        # Extra allowed hosts for local testing (port-mapped access via localhost)
        horizon_extra_allowed_hosts:
          - "127.0.0.1"

        # Akka cluster communication ports
        horizon_akka_discovery_port: 7626
        horizon_akka_artery_port: 17335
        horizon_internal_api_port: 9000


verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
  destroy_sequence:
    - dependency
    - destroy