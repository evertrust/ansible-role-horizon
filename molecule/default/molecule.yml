driver:
  name: docker

platforms:
  # Horizon application nodes
  - name: horizon-node1
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: horizon-network
    published_ports:
      - "9001:9000"
      - "4431:443"
    groups:
      - horizon_nodes

