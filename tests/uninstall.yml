---
- name: Uninstall Horizon
  hosts: horizon_nodes
  become: true
  gather_facts: true
  
  tasks:
    - name: Stop Horizon service
      ansible.builtin.systemd:
        name: horizon
        state: stopped
      ignore_errors: true
    
    - name: Stop nginx service
      ansible.builtin.systemd:
        name: nginx
        state: stopped
      ignore_errors: true
    
    - name: Stop postfix service
      ansible.builtin.systemd:
        name: postfix
        state: stopped
      ignore_errors: true
    
    - name: Remove Horizon RPM
      ansible.builtin.yum:
        name: horizon
        state: absent

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reset failed state of horizon service
      ansible.builtin.command: systemctl reset-failed horizon
      ignore_errors: true
      changed_when: false

    - name: Remove Tinkey RPM
      ansible.builtin.yum:
        name: tinkey
        state: absent
      ignore_errors: true

    - name: Remove Mongosh RPM
      ansible.builtin.yum:
        name: mongodb-mongosh
        state: absent
      ignore_errors: true
    
    - name: Remove Horizon directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/horizon
        - /opt/evertrust
        - /etc/default/horizon
        - /etc/default/horizon.rpmsave
        - /etc/nginx/conf.d/horizon.conf
        - /etc/nginx/ssl/horizon.key
        - /etc/nginx/ssl/horizon.pem
        - /etc/nginx/ssl/horizon.csr
        - /etc/nginx/ssl/horizon-chain.pem
    
    - name: Remove Horizon entries from /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Horizon Cluster"
        state: absent
    
    - name: Remove firewall rules
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: disabled
        immediate: true
      loop:
        - 443/tcp
        - 7626/tcp
        - 17335/tcp
      ignore_errors: true